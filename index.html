<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VAREXON</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      height: 66px;
      background: #000;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1000;
    }

    .logo {
      font-family: Georgia, serif;
      font-size: 31px;
      letter-spacing: 7px;
      color: #fff;
      font-weight: 500;
      text-decoration: none;
    }

    .menu-btn {
      position: absolute;
      left: 27px;
      top: 50%;
      transform: translateY(-50%);
      width: 37px;
      height: 30px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 4px 0;
    }

    .menu-btn span {
      width: 37px;
      height: 2px;
      background: #fff;
      display: block;
    }

    .header-right {
      position: absolute;
      right: 27px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .search-btn,
    .cart-btn {
      background: none;
      border: none;
      cursor: pointer;
      position: relative;
    }

    .search-icon {
      width: 25px;
      height: 25px;
      border: 2px solid #fff;
      border-radius: 50%;
      position: relative;
      display: block;
    }

    .search-icon::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 2px;
      background: #fff;
      right: -7px;
      bottom: 0;
      transform: rotate(48deg);
      transform-origin: left center;
    }

    .cart-icon {
      width: 25px;
      height: 22px;
      border: 2px solid #fff;
      border-top: none;
      display: block;
      position: relative;
    }

    .cart-icon::before {
      content: "";
      position: absolute;
      top: -3px;
      left: -3px;
      width: 27px;
      height: 2px;
      background: #fff;
    }

    .cart-count {
      position: absolute;
      right: -9px;
      top: -10px;
      background: #fff;
      color: #000;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      font-size: 10px;
      display: none;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    /* =========================
       SIDE MENU
    ========================= */

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(5px);
      z-index: 1900;
      display: none;
    }

    .overlay.active {
      display: block;
    }

    .side-menu {
      position: fixed;
      left: -360px;
      top: 0;
      width: 340px;
      max-width: 80%;
      height: 100vh;
      background: #090909;
      z-index: 2000;
      transition: left .3s ease;
      border-right: 1px solid #252525;
      padding: 90px 35px 30px;
    }

    .side-menu.active {
      left: 0;
    }

    .close-menu {
      position: absolute;
      top: 25px;
      right: 25px;
      background: none;
      border: none;
      color: #fff;
      font-size: 30px;
      cursor: pointer;
    }

    .side-menu a {
      display: block;
      color: #fff;
      text-decoration: none;
      font-size: 20px;
      padding: 18px 0;
      border-bottom: 1px solid #222;
    }

    .side-menu .login-area {
      margin-top: 35px;
    }

    .side-menu button {
      width: 100%;
      padding: 13px;
      background: #fff;
      color: #000;
      border: none;
      cursor: pointer;
      font-size: 15px;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-panel {
      position: fixed;
      top: 66px;
      left: 0;
      right: 0;
      background: #050505;
      border-bottom: 1px solid #222;
      padding: 20px;
      z-index: 1500;
      display: none;
    }

    .search-panel.active {
      display: block;
    }

    .search-input {
      width: 100%;
      max-width: 700px;
      display: block;
      margin: auto;
      background: #111;
      color: #fff;
      border: 1px solid #333;
      padding: 15px 17px;
      font-size: 16px;
      outline: none;
    }

    .search-results {
      width: 100%;
      max-width: 700px;
      margin: 10px auto 0;
    }

    .search-result {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 10px;
      border-bottom: 1px solid #222;
      cursor: pointer;
    }

    .search-result img {
      width: 65px;
      height: 65px;
      object-fit: cover;
      border-radius: 5px;
    }

    .search-result-info strong {
      display: block;
      margin-bottom: 6px;
    }

    .search-result-info span {
      color: #aaa;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      width: 100%;
      position: relative;
      background: #111;
      overflow: hidden;
    }

    .hero img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 620px;
      object-fit: cover;
      cursor: pointer;
    }

    .hero-dot {
      position: absolute;
      bottom: 23px;
      left: 50%;
      transform: translateX(-50%);
      width: 10px;
      height: 10px;
      background: #fff;
      border-radius: 50%;
    }

    /* =========================
       PRODUCTS
    ========================= */

    .products-section {
      padding: 45px 28px 80px;
      background: #000;
    }

    .section-title {
      font-size: 40px;
      font-weight: 700;
      margin-bottom: 28px;
      letter-spacing: 1px;
    }

    .category-title {
      font-size: 25px;
      font-weight: 400;
      margin: 0 0 28px 15px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 35px;
    }

    .product-card {
      cursor: pointer;
      max-width: 280px;
    }

    .product-image-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 14px;
      background: #111;
    }

    .product-image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .3s ease;
    }

    .product-card:hover .product-image-box img {
      transform: scale(1.03);
    }

    .product-name {
      font-size: 18px;
      line-height: 1.35;
      font-weight: 600;
      margin-top: 18px;
    }

    .product-price {
      font-size: 19px;
      margin-top: 15px;
      color: #ddd;
      text-align: center;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      border-top: 1px solid #252525;
      padding: 60px 45px 45px;
      background: #000;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
    }

    .footer-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 30px;
    }

    .footer-text {
      color: #999;
      font-size: 17px;
      line-height: 2.1;
    }

    .footer-text a {
      color: #999;
      text-decoration: none;
    }

    .footer-logo {
      text-align: center;
      margin-top: 50px;
      color: #666;
      font-family: Georgia, serif;
      letter-spacing: 7px;
      font-size: 20px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      header {
        height: 66px;
      }

      .logo {
        font-size: 28px;
        letter-spacing: 6px;
      }

      .menu-btn {
        left: 27px;
      }

      .header-right {
        right: 27px;
        gap: 22px;
      }

      .hero img {
        width: 100%;
        height: auto;
        object-fit: cover;
      }

      .products-section {
        padding: 43px 27px 80px;
      }

      .section-title {
        font-size: 37px;
        margin-bottom: 31px;
      }

      .category-title {
        font-size: 24px;
        margin-left: 15px;
        margin-bottom: 27px;
      }

      .products-grid {
        grid-template-columns: 1fr;
        gap: 45px;
      }

      .product-card {
        max-width: 245px;
      }

      .product-image-box {
        border-radius: 13px;
      }

      .product-name {
        font-size: 18px;
      }

      .product-price {
        font-size: 19px;
        text-align: center;
      }

      footer {
        padding: 60px 46px 45px;
      }

      .footer-grid {
        grid-template-columns: 1fr 1fr;
        gap: 35px;
      }

      .footer-title {
        font-size: 18px;
        margin-bottom: 27px;
      }

      .footer-text {
        font-size: 16px;
      }

      .footer-logo {
        font-size: 19px;
      }
    }

    @media (max-width: 420px) {

      .logo {
        font-size: 25px;
        letter-spacing: 5px;
      }

      .menu-btn {
        left: 27px;
      }

      .header-right {
        right: 27px;
      }

      .products-section {
        padding-left: 27px;
        padding-right: 27px;
      }

      .product-card {
        max-width: 245px;
      }

      footer {
        padding-left: 46px;
        padding-right: 46px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================= -->

  <header>

    <div class="menu-btn" id="menuBtn">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <a href="index.html" class="logo">VAREXON</a>

    <div class="header-right">

      <button class="search-btn" id="searchBtn">
        <span class="search-icon"></span>
      </button>

      <button class="cart-btn" id="cartBtn">
        <span class="cart-icon"></span>
        <span class="cart-count" id="cartCount">0</span>
      </button>

    </div>

  </header>


  <!-- =========================
       SIDE MENU
  ========================= -->

  <div class="overlay" id="overlay"></div>

  <aside class="side-menu" id="sideMenu">

    <button class="close-menu" id="closeMenu">×</button>

    <a href="index.html">Ana Sayfa</a>
    <a href="hakkimizda.html">Hakkımızda</a>
    <a href="sepet.html">Sepet</a>
    <a href="iletisim.html">İletişim</a>

    <div class="login-area">
      <button id="authButton">Giriş Yap</button>
    </div>

  </aside>


  <!-- =========================
       SEARCH PANEL
  ========================= -->

  <div class="search-panel" id="searchPanel">

    <input
      type="text"
      id="searchInput"
      class="search-input"
      placeholder="Ürün ara..."
    >

    <div class="search-results" id="searchResults"></div>

  </div>


  <!-- =========================
       HERO
  ========================= -->

  <section class="hero">

    <img
      id="heroImage"
      src="WhatsApp Image 2026-09-30 at 18.32.19.jpeg"
      alt="VAREXON"
    >

    <div class="hero-dot"></div>

  </section>


  <!-- =========================
       PRODUCTS
  ========================= -->

  <main class="products-section">

    <h1 class="section-title">TİŞÖRT</h1>

    <h2 class="category-title">Siyah</h2>

    <div class="products-grid" id="productsGrid">

      <div
        class="product-card"
        data-page="urun-detay.html"
      >

        <div class="product-image-box">

          <img
            src="WhatsApp Image 2026-09-30 at 17.22.44.jpeg"
            alt="Tiger Tasarımlı Siyah Tişört"
          >

        </div>

        <div class="product-name">
          Tiger Tasarımlı Siyah<br>
          Tişört
        </div>

        <div class="product-price">
          499 TL
        </div>

      </div>

    </div>

  </main>


  <!-- =========================
       FOOTER
  ========================= -->

  <footer>

    <div class="footer-grid">

      <div>

        <div class="footer-title">
          İLETİŞİM
        </div>

        <div class="footer-text">
          <a href="mailto:varexonwearr@gmail.com">
            varexonwearr@gmail.com
          </a>
        </div>

      </div>


      <div>

        <div class="footer-title">
          SOSYAL MEDYA
        </div>

        <div class="footer-text">

          <div>
            <a
              href="https://instagram.com/varexonwearr"
              target="_blank"
            >
              Instagram: varexonwearr
            </a>
          </div>

          <div>
            <a
              href="https://www.tiktok.com/@varexonwearr"
              target="_blank"
            >
              TikTok: varexonwearr
            </a>
          </div>

        </div>

      </div>

    </div>

    <div class="footer-logo">
      V A R E X O N
    </div>

  </footer>


  <!-- =========================
       FIREBASE
  ========================= -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

    import {
      getFirestore,
      collection,
      query,
      where,
      getDocs
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyD8osmrzNWj32T-1kNx-jmHlWcAm5_7xeg",
      authDomain: "velron-831db.firebaseapp.com",
      projectId: "velron-831db",
      storageBucket: "velron-831db.firebasestorage.app",
      messagingSenderId: "622435814773",
      appId: "1:622435814773:web:bd94aff51e78ba2a7c573c",
      measurementId: "G-74XHVN6V22"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    /* =========================
       MENU
    ========================= */

    const menuBtn = document.getElementById("menuBtn");
    const sideMenu = document.getElementById("sideMenu");
    const closeMenu = document.getElementById("closeMenu");
    const overlay = document.getElementById("overlay");

    function openMenu() {
      sideMenu.classList.add("active");
      overlay.classList.add("active");
    }

    function closeSideMenu() {
      sideMenu.classList.remove("active");
      overlay.classList.remove("active");
    }

    menuBtn.addEventListener("click", openMenu);

    closeMenu.addEventListener("click", closeSideMenu);

    overlay.addEventListener("click", closeSideMenu);


    /* =========================
       SEARCH
    ========================= */

    const searchBtn = document.getElementById("searchBtn");
    const searchPanel = document.getElementById("searchPanel");
    const searchInput = document.getElementById("searchInput");
    const searchResults = document.getElementById("searchResults");

    searchBtn.addEventListener("click", () => {

      searchPanel.classList.toggle("active");

      if (searchPanel.classList.contains("active")) {
        searchInput.focus();
      }

    });


    const products = [

      {
        id: "tiger",
        name: "Tiger Tasarımlı Siyah Tişört",
        price: 499,
        image: "WhatsApp Image 2026-09-30 at 17.22.44.jpeg",
        page: "urun-detay.html",
        category: "tisort"
      }

    ];


    function showSearchResults(value) {

      const text = value.toLowerCase().trim();

      searchResults.innerHTML = "";

      if (!text) {
        return;
      }

      const filtered = products.filter(product =>
        product.name.toLowerCase().includes(text)
      );

      if (filtered.length === 0) {

        searchResults.innerHTML = `
          <div style="
            color:#888;
            padding:15px 5px;
          ">
            Ürün bulunamadı.
          </div>
        `;

        return;
      }


      filtered.forEach(product => {

        const result = document.createElement("div");

        result.className = "search-result";

        result.innerHTML = `

          <img
            src="${product.image}"
            alt="${product.name}"
          >

          <div class="search-result-info">

            <strong>
              ${product.name}
            </strong>

            <span>
              ${product.price} TL
            </span>

          </div>

        `;


        result.addEventListener("click", () => {

          window.location.href = product.page;

        });


        searchResults.appendChild(result);

      });

    }


    searchInput.addEventListener("input", () => {

      showSearchResults(searchInput.value);

    });


    /* =========================
       HERO CLICK
    ========================= */

    const heroImage = document.getElementById("heroImage");

    heroImage.addEventListener("click", () => {

      window.location.href = "urun-detay.html";

    });


    /* =========================
       PRODUCT CLICK
    ========================= */

    const productCards =
      document.querySelectorAll(".product-card");

    productCards.forEach(card => {

      card.addEventListener("click", () => {

        const page = card.dataset.page;

        if (page) {
          window.location.href = page;
        }

      });

    });


    /* =========================
       CART
    ========================= */

    const cartBtn = document.getElementById("cartBtn");
    const cartCount = document.getElementById("cartCount");

    cartBtn.addEventListener("click", () => {

      window.location.href = "sepet.html";

    });


    function updateCartCount() {

      try {

        const cart =
          JSON.parse(localStorage.getItem("velron_cart")) || [];

        const count = cart.reduce(
          (total, item) => total + (item.quantity || 1),
          0
        );

        if (count > 0) {

          cartCount.textContent = count;
          cartCount.style.display = "flex";

        } else {

          cartCount.style.display = "none";

        }

      } catch (error) {

        cartCount.style.display = "none";

      }

    }

    updateCartCount();


    /* =========================
       AUTH
    ========================= */

    const authButton =
      document.getElementById("authButton");


    onAuthStateChanged(auth, user => {

      if (user) {

        authButton.textContent = "Çıkış Yap";

        authButton.onclick = async () => {

          try {

            await signOut(auth);

            window.location.reload();

          } catch (error) {

            console.error(error);

          }

        };

      } else {

        authButton.textContent = "Giriş Yap";

        authButton.onclick = () => {

          window.location.href = "giris.html";

        };

      }

    });


  </script>

</body>
</html>
