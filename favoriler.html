<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">

<title>Favoriler - VAREXON</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    background:#000;
    color-scheme:dark;
    -webkit-text-size-adjust:100%;
}

body{
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
    overflow-x:hidden;
}

button{
    font:inherit;
}

/* =========================
   HEADER
========================= */

.header{
    width:100%;
    height:55px;

    background:#000;

    display:flex;
    align-items:center;
    justify-content:center;

    border-bottom:1px solid #222;

    position:relative;
}

.back-button{
    position:absolute;
    left:15px;

    width:30px;
    height:30px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:none;
    border:none;

    color:#fff;

    font-size:28px;
    font-weight:300;

    cursor:pointer;
    padding:0;
}

.logo{
    font-family:Georgia,"Times New Roman",serif;

    font-size:18px;
    font-weight:bold;

    letter-spacing:5px;

    color:#fff;
}

/* =========================
   BAŞLIK
========================= */

.title{
    padding:28px 15px 22px;
}

.title h1{
    color:#fff;

    font-size:22px;
    font-weight:700;

    letter-spacing:1px;
}

/* =========================
   FAVORİLER
========================= */

.favorites{
    padding:0 15px 50px;
}

.favorite-grid{
    width:100%;

    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:28px 10px;
}

/* =========================
   ÜRÜN
========================= */

.favorite-product{
    width:100%;
    cursor:pointer;

    -webkit-tap-highlight-color:transparent;
}

.favorite-product img{
    width:100%;
    display:block;

    border-radius:8px;

    background:#111;

    filter:
        saturate(1.20)
        contrast(1.05);
}

.favorite-product h3{
    color:#fff;

    font-size:11px;
    font-weight:500;

    line-height:1.4;

    margin-top:8px;
}

.favorite-product p{
    color:#ddd;

    font-size:11px;

    margin-top:5px;
}

/* =========================
   FAVORİDEN KALDIR
========================= */

.favorite-remove{
    width:100%;

    margin-top:8px;
    padding:7px 0;

    background:#111;

    border:1px solid #292929;

    color:#888;

    font-size:9px;

    cursor:pointer;
}

.favorite-remove:hover{
    color:#fff;
    border-color:#444;
}

/* =========================
   BOŞ FAVORİ
========================= */

.empty{
    display:none;

    text-align:center;

    color:#777;

    font-size:13px;

    padding:70px 20px;
}

.empty-title{
    color:#fff;

    font-size:15px;

    margin-bottom:8px;
}

.empty-text{
    color:#777;

    font-size:11px;
}

/* =========================
   MOBİL
========================= */

@media(max-width:700px){

    .header{
        height:55px;
    }

    .title{
        padding:25px 15px 20px;
    }

    .favorite-grid{
        gap:24px 10px;
    }

    .favorite-product h3{
        font-size:11px;
    }

    .favorite-product p{
        font-size:11px;
    }

}

@media(max-width:360px){

    .favorites{
        padding-left:12px;
        padding-right:12px;
    }

    .favorite-grid{
        gap:22px 8px;
    }

}

</style>

</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="header">

    <button
        class="back-button"
        id="backButton"
        type="button"
        aria-label="Geri"
    >
        ‹
    </button>

    <div class="logo">
        VAREXON
    </div>

</header>


<!-- =========================
     BAŞLIK
========================= -->

<section class="title">

    <h1>
        FAVORİLER
    </h1>

</section>


<!-- =========================
     FAVORİLER
========================= -->

<section class="favorites">

    <div
        class="favorite-grid"
        id="favoriteGrid"
    ></div>


    <div
        class="empty"
        id="emptyFavorites"
    >

        <div class="empty-title">
            Henüz favori ürünün yok.
        </div>

        <div class="empty-text">
            Beğendiğin ürünleri favorilerine ekleyebilirsin.
        </div>

    </div>

</section>


<script>

/* =========================
   FAVORİ ANAHTARI
========================= */

const FAVORITES_KEY =
    "velron_favorites";


/* =========================
   ÜRÜNLER
========================= */

const products = [

    {
        name:
            "Porsche Tasarımlı Siyah Tişört",

        price:
            499,

        image:
            "WhatsApp Image 2026-09-30 at 17.22.44.jpeg",

        page:
            "urun-detay.html",

        category:
            "tisort"
    },


    {
        name:
            "Aslan Tasarımlı Siyah Tişört",

        price:
            499,

        image:
            "aslan.png",

        page:
            "urun-aslan.html",

        category:
            "tisort"
    },


    {
        name:
            "Dark Devil Tasarımlı Siyah Tişört",

        price:
            499,

        image:
            "darkdevil.png",

        page:
            "urun-darkdevil.html",

        category:
            "tisort"
    },


    {
        name:
            "Kurukafa Tasarımlı Siyah Tişört",

        price:
            499,

        image:
            "kurukafa.png",

        page:
            "urun-kurukafa.html",

        category:
            "tisort"
    },


    {
        name:
            "Monza Tasarımlı Beyaz Tişört",

        price:
            499,

        image:
            "monza.png",

        page:
            "urun-monza.html",

        category:
            "tisort"
    },


    {
        name:
            "Voltage Tasarımlı Beyaz Tişört",

        price:
            499,

        image:
            "voltage.png",

        page:
            "urun-voltage.html",

        category:
            "tisort"
    },


    {
        name:
            "Porsche Tasarımlı Beyaz Tişört",

        price:
            499,

        image:
            "porsche.png",

        page:
            "urun-porsche.html",

        category:
            "tisort"
    },


    {
        name:
            "Varexon Tasarımlı Beyaz Tişört",

        price:
            499,

        image:
            "velron.png",

        page:
            "urun-velron.html",

        category:
            "tisort"
    }

];


/* =========================
   FAVORİLERİ OKU
========================= */

function getFavorites(){

    const saved =
        localStorage.getItem(
            FAVORITES_KEY
        );

    if(!saved){

        return [];

    }

    try{

        const parsed =
            JSON.parse(saved);

        if(!Array.isArray(parsed)){

            return [];

        }

        return parsed;

    }catch(error){

        return [];

    }

}


/* =========================
   FAVORİ ADINI AL
========================= */

function getFavoriteName(item){

    if(
        typeof item ===
        "string"
    ){

        return item;

    }


    if(
        item &&
        typeof item === "object" &&
        typeof item.name === "string"
    ){

        return item.name;

    }


    return "";

}


/* =========================
   GERÇEK FAVORİLERİ BUL
========================= */

function getFavoriteProducts(){

    const favorites =
        getFavorites();

    const result = [];


    favorites.forEach(
        function(item){

            const favoriteName =
                getFavoriteName(item);


            if(!favoriteName){

                return;

            }


            const product =
                products.find(
                    function(product){

                        return (
                            product.name ===
                            favoriteName
                        );

                    }
                );


            if(!product){

                return;

            }


            const alreadyExists =
                result.some(
                    function(existing){

                        return (
                            existing.name ===
                            product.name
                        );

                    }
                );


            if(!alreadyExists){

                result.push(
                    product
                );

            }

        }
    );


    return result;

}


/* =========================
   FAVORİDEN ÇIKAR
========================= */

function removeFavorite(
    productName
){

    const favorites =
        getFavorites();


    const updated =
        favorites.filter(
            function(item){

                return (
                    getFavoriteName(item) !==
                    productName
                );

            }
        );


    localStorage.setItem(
        FAVORITES_KEY,
        JSON.stringify(updated)
    );


    renderFavorites();

}


/* =========================
   FAVORİLERİ GÖSTER
========================= */

function renderFavorites(){

    const grid =
        document.getElementById(
            "favoriteGrid"
        );

    const empty =
        document.getElementById(
            "emptyFavorites"
        );


    grid.innerHTML = "";


    const favoriteProducts =
        getFavoriteProducts();


    /* FAVORİ YOK */

    if(
        favoriteProducts.length === 0
    ){

        empty.style.display =
            "block";

        return;

    }


    /* FAVORİ VAR */

    empty.style.display =
        "none";


    favoriteProducts.forEach(
        function(product){

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "favorite-product";


            item.addEventListener(
                "click",
                function(){

                    window.location.href =
                        product.page;

                }
            );


            item.innerHTML = `

                <img
                    src="${product.image}"
                    alt="${product.name}"
                    loading="lazy"
                    decoding="async"
                >

                <h3>
                    ${product.name}
                </h3>

                <p>
                    ${product.price} TL
                </p>

                <button
                    class="favorite-remove"
                    type="button"
                >
                    Favorilerden kaldır
                </button>

            `;


            const removeButton =
                item.querySelector(
                    ".favorite-remove"
                );


            removeButton.addEventListener(
                "click",
                function(event){

                    event.preventDefault();

                    event.stopPropagation();


                    removeFavorite(
                        product.name
                    );

                }
            );


            grid.appendChild(
                item
            );

        }
    );

}


/* =========================
   GERİ BUTONU
========================= */

document
    .getElementById("backButton")
    .addEventListener(
        "click",
        function(){

            history.back();

        }
    );


/* =========================
   SAYFA AÇILINCA
========================= */

renderFavorites();


/* =========================
   GERİ GELİNCE
========================= */

window.addEventListener(
    "pageshow",
    function(){

        renderFavorites();

    }
);


/* =========================
   SEKMEYE GERİ GELİNCE
========================= */

window.addEventListener(
    "focus",
    function(){

        renderFavorites();

    }
);

</script>

</body>

</html>
